name: 'Free disk space'
description: 'Maximize the available disk space for OpenWrt build job'
branding:
  icon: 'crop'
  color: 'orange'
runs:
  using: "composite"
  steps:
    - name: Show system
      shell: bash
      run: |
        echo -e "\e[1;32mMemory:\e[0m"
        free -h
        echo -e "\e[1;32mStorage:\e[0m"
        df -Th /
        echo

    - name: Free disk space
      shell: bash
      run: |
        sudo find /opt -mindepth 1 -maxdepth 1 ! -name "*runner*" -exec rm -rf {} \;
        sudo rm -rf /usr/local/lib/android \
         /usr/lib/google-cloud-sdk \
         /usr/lib/jvm \
         /usr/lib/{clang-16,clang-17,llvm-16,llvm-17} \
         /usr/local/aws* \
         /usr/local/julia* \
         /usr/local/share/{chromium,powershell,vcpkg} \
         /usr/share/dotnet \
         /usr/share/swift
        sudo sysctl -w vm.drop_caches=3

    - name: Disk space report after modification
      shell: bash
      run: |
        echo -e "\n\e[1;32mMemory:\e[0m"
        sudo free -h
        echo -e "\e[1;32mAvailable Storage:\e[0m"
        sudo df -Th
